<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" role="img" aria-labelledby="wb-t wb-d">
<title id="wb-t">lets-site</title>
<desc id="wb-d">lets-site: the website at lets.offensiveadhd.com. A browser frame shows the landing page: the lets logo and name, the line Talk to Claude through windows, not just text, and an Install the engine button. In the stage beside it, among three node chips, Doto, a violet orb, rolls after the pointer as it circles.</desc>
<style>text{font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,"Cascadia Code",SFMono-Regular,Menlo,Consolas,monospace}</style>
